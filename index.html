<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Horarios IENC — San Nicolás</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>Horarios IENC — San Nicolás</h1>
            <p>Jornada Mañana · 2026</p>
        </header>

        <nav class="tabs" id="tabs">
            <button class="tab active" data-tab="docente">Docente</button>
            <button class="tab" data-tab="curso">Curso</button>
            <button class="tab" data-tab="salon">Salón</button>
            <button class="tab" data-tab="reuniones">Reuniones</button>
            <button class="tab" data-tab="atencion">At. acudientes</button>
            <button class="tab" data-tab="salones-base">Salones base</button>
            <button class="tab" data-tab="disponibilidad">Disponibilidad</button>
        </nav>

        <!-- FILTRO: Docente -->
        <section class="panel active" id="panel-docente">
            <div class="filter-row">
                <select id="select-docente"><option value="">Selecciona un docente…</option></select>
            </div>
            <div id="result-docente"></div>
        </section>

        <!-- FILTRO: Curso -->
        <section class="panel" id="panel-curso">
            <div class="filter-row">
                <select id="select-curso"><option value="">Selecciona un curso…</option></select>
            </div>
            <div id="result-curso"></div>
        </section>

        <!-- FILTRO: Salón -->
        <section class="panel" id="panel-salon">
            <div class="filter-row">
                <select id="select-salon"><option value="">Selecciona un salón…</option></select>
            </div>
            <div id="result-salon"></div>
        </section>

        <!-- FILTRO: Reuniones de área -->
        <section class="panel" id="panel-reuniones">
            <div id="result-reuniones"></div>
        </section>

        <!-- FILTRO: Atención a acudientes -->
        <section class="panel" id="panel-atencion">
            <div id="result-atencion"></div>
        </section>

        <!-- FILTRO: Salones base -->
        <section class="panel" id="panel-salones-base">
            <div id="result-salones-base"></div>
        </section>

        <!-- FILTRO: Disponibilidad -->
        <section class="panel" id="panel-disponibilidad">
            <div class="filter-row">
                <select id="select-disp-dia">
                    <option value="">Día…</option>
                    <option>Lunes</option><option>Martes</option><option>Miércoles</option><option>Jueves</option><option>Viernes</option>
                </select>
                <select id="select-disp-hora">
                    <option value="">Hora…</option>
                    <option value="1">1° 6:00 - 6:55</option>
                    <option value="2">2° 6:55 - 7:50</option>
                    <option value="3">3° 7:50 - 8:45</option>
                    <option value="4">4° 8:45 - 9:40</option>
                    <option value="5">5° 10:20 - 11:10</option>
                    <option value="6">6° 11:10 - 12:00</option>
                </select>
            </div>
            <div id="result-disponibilidad"></div>
        </section>

        <footer class="footer">
            IE Nuevo Compartir — San Nicolás · Soacha
        </footer>
    </div>

    <script src="horarios-data.js"></script>
    <script src="reuniones-atencion-data.js"></script>
    <script src="app.js"></script>
</body>
</html>
